services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/career?sslmode=disable
      JWT_SECRET: change-me-in-prod
      # LLM defaults to the deterministic mock. To use a real model:
      # LLM_PROVIDER: anthropic   # or openai
      # LLM_API_KEY: sk-...
      # LLM_MODEL: claude-sonnet-4-6
      STORAGE_DIR: /app/data/uploads
      VECTOR_DIR: /app/data/vectors
    ports:
      - "8081:8080"
    volumes:
      - apidata:/app/data

volumes:
  pgdata:
  apidata:
